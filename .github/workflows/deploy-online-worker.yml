name: Deploy MeMeMe Online Worker

on:
  push:
    branches:
      - mmm-mvp-0.1-core
    paths:
      - cloudflare/mememe-online/**
      - .github/workflows/deploy-online-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mememe-online-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/mememe-online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy mememe-online
        env:
          TOKEN_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOKEN_CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          TOKEN_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0fd870345f30d738da3d55ad72de39ce
        run: |
          set -euo pipefail

          token=""
          alias=""
          for candidate in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_WORKERS_TOKEN CLOUDFLARE_TOKEN; do
            case "$candidate" in
              CLOUDFLARE_API_TOKEN) value="${TOKEN_CLOUDFLARE_API_TOKEN:-}" ;;
              CF_API_TOKEN) value="${TOKEN_CF_API_TOKEN:-}" ;;
              CLOUDFLARE_WORKERS_TOKEN) value="${TOKEN_CLOUDFLARE_WORKERS_TOKEN:-}" ;;
              CLOUDFLARE_TOKEN) value="${TOKEN_CLOUDFLARE_TOKEN:-}" ;;
            esac
            if [ -n "$value" ]; then token="$value"; alias="$candidate"; break; fi
          done

          if [ -z "$token" ]; then
            echo "No Cloudflare deploy token found under the supported repository secret aliases."
            exit 2
          fi

          echo "Using Cloudflare token alias: $alias"
          export CLOUDFLARE_API_TOKEN="$token"
          npx wrangler deploy

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -fsS https://mememe-online.lengochung28191.workers.dev/health || true)"
            echo "attempt=$i health=$body"
            if echo "$body" | grep -q '"milestone":"0.1.70.4.20"' \
              && echo "$body" | grep -q '"transportKeepalive":true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
