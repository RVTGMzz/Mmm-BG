name: Roguelike outlier diagnostic

on:
  push:
    branches:
      - mmm-mvp-0.1-core
    paths:
      - tests/roguelike-outlier-diagnostic-071.ts
      - .github/workflows/roguelike-outlier-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx tests/roguelike-outlier-diagnostic-071.ts
