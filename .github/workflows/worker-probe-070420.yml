name: One-shot 0.1.70.4.20 Worker probe

on:
  push:
    branches:
      - mmm-mvp-0.1-core
    paths:
      - .github/workflows/worker-probe-070420.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker 0.1.70.4.20
        shell: bash
        run: |
          set -euo pipefail
          base="https://mememe-online.lengochung28191.workers.dev"
          for i in $(seq 1 18); do
            body="$(curl -fsS "$base/health" || true)"
            echo "attempt=$i health=$body"
            if echo "$body" | grep -q '"milestone":"0.1.70.4.20"' \
              && echo "$body" | grep -q '"transportKeepalive":true'; then
              exit 0
            fi
            sleep 10
          done
          echo "Worker 0.1.70.4.20 did not become live in time."
          exit 1

      - name: Reclaim stale custom code 123123
        shell: bash
        run: |
          set -euo pipefail
          base="https://mememe-online.lengochung28191.workers.dev"
          payload='{"hostName":"Recycle Probe","roomCode":"123123","settings":{"cameraAllowed":true,"voiceAllowed":true,"cpuFill":true},"deviceId":"ci-recycle-070420"}'
          code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "$base/api/rooms" -H 'Content-Type: application/json' --data "$payload")"
          echo "create_status=$code"
          cat /tmp/create.json
          echo
          test "$code" = "201"
          token="$(python -c "import json; print(json.load(open('/tmp/create.json'))['hostToken'])")"
          curl -fsS -X POST "$base/api/rooms/123123/close" \
            -H 'Content-Type: application/json' \
            --data "{\"hostToken\":\"$token\",\"reason\":\"host_left\"}" >/tmp/close.json
          cat /tmp/close.json
          echo

# one-shot trigger v2
