      - name: 0.1.70.4.10 Job single-owner and Mini Game input
        run: npm run test:job-minigame-input-070410
      - name: 0.1.70.4.11 Job flow consolidation
        run: npm run test:job-flow-consolidation-070411
      - name: 0.1.70.4.12 runtime presentation leak cleanup
        run: npm run test:presentation-leak-cleanup-070412
      - name: 0.1.70.4.13 visual preflight hardening
        run: npm run test:visual-preflight-070413
      - name: 0.1.70.4.14 presentation layout lock
        run: npm run test:presentation-layout-lock-070414
      - name: 0.1.70.4.15 presentation spacing pass
        run: npm run test:presentation-spacing-070415
      - name: 0.1.70.4.16 semantic card footer + reaction split
        run: npm run test:presentation-semantic-footer-070416
      - name: 0.1.70.4.17 global cinematic ownership + token badge guard
        run: npm run test:presentation-global-guard-070417
      - name: 0.1.70.4.18 adaptive presentation safe area
        run: npm run test:presentation-adaptive-safearea-070418
      - name: 0.1.70.4.19 runtime reliability + release guard
        run: npm run test:runtime-release-guard-070419
      - name: 0.1.70.4.19 live two-device reconnect + media relay smoke
        run: npm run test:online-live-runtime-070419
      - name: 0.1.70.4.20 stale room recycle + WebSocket keepalive
        run: npm run test:online-stale-room-recycle-070420
      - name: 0.1.70.4.21 final modal ownership + career layout
        run: npm run test:final-modal-career-070421
      - name: 0.1.70.4.22 presentation single owner + safe reactions
        run: npm run test:presentation-owner-070422
      - name: Visual Foundation 0.1 VF-01 tokens + VF-02 buttons
        run: npm run test:visual-foundation-v01
      - name: Roguelike Lap Shuffle 0.1 deterministic authority
        run: npm run test:roguelike-lap-shuffle-071
      - name: 0.1.70.3.1 mobile landscape and face style
        run: npm run test:mobile-face-07031
      - name: Face image transform bounds
        run: npm run test:image
      - name: Validate external playtest package
        run: npm run test:package
      - name: Add retained playtest guide to package
        run: cp docs/PLAYTEST_0.1.70.1_RELEASE_FLOW_UI_DENSITY.md dist/PLAYTEST_GUIDE.md
      - name: Upload MVP 0.1.70.4.22 + Single Owner + Safe Reactions build
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mmm-playtest-0.1.70.4.22-presentation-owner
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Checkout compiled GitHub playtest mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/mmm-mvp-0.1-core'
        uses: actions/checkout@v4
        with:
          repository: ronvotri/MeMeMe-Web-Playtest
          token: ${{ secrets.MMM_WEB_DEPLOY_TOKEN }}
          path: public-mirror

      - name: Verify public Pages release guard
        if: github.event_name == 'push' && github.ref == 'refs/heads/mmm-mvp-0.1-core'
        shell: bash
        run: |
          set -euo pipefail
          test -f public-mirror/.github/workflows/pages.yml
          test -f public-mirror/index.html
          grep -q 'Publish playtest Pages' public-mirror/.github/workflows/pages.yml

      - name: Publish compiled GitHub playtest mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/mmm-mvp-0.1-core'
        shell: bash
        run: |
          set -euo pipefail

          # Vite copies public/ to the root of dist/. Audio therefore lives in
          # dist/audio, not dist/assets. Mirror the complete compiled output so
          # BGM, SFX, manifest and future public assets can never be dropped.
          # Keep the mirror's own GitHub Pages workflow. Removing .github here
          # silently disabled future Pages deploys and caused the public 404.
          find public-mirror -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a dist/. public-mirror/
          sed -i '1i<!-- Compiled playtest build only. Source is not mirrored here. -->' public-mirror/index.html

          test -f public-mirror/.github/workflows/pages.yml
          test -f public-mirror/index.html
          test -f public-mirror/manifest.webmanifest
          test -d public-mirror/assets

          js_asset="$(sed -n 's/.*src="\.\/\([^"]*\.js\)".*/\1/p' public-mirror/index.html | head -n1)"
          css_asset="$(sed -n 's/.*href="\.\/\([^"]*\.css\)".*/\1/p' public-mirror/index.html | head -n1)"
          test -n "$js_asset" && test -f "public-mirror/$js_asset"
          test -n "$css_asset" && test -f "public-mirror/$css_asset"

          test -f public-mirror/audio/bgm/01_Menu_MeMeMe.ogg
          test -f public-mirror/audio/bgm/02_City_Bubble.ogg
          test -f public-mirror/audio/bgm/03_City_Silly.ogg
          test -f public-mirror/audio/bgm/04_Final_Round.ogg
          test -f public-mirror/audio/sfx/dice.ogg
          test -f public-mirror/audio/sfx/choice.ogg
          test -f public-mirror/audio/sfx/money_gain.ogg
          test -f public-mirror/audio/sfx/step.ogg

          cd public-mirror
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Compiled GitHub playtest already matches this build.'
            exit 0
          fi
          git commit -m "Publish compiled playtest ${GITHUB_SHA::7}"
          git push
