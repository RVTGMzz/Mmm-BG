name: MeMeMe MVP CI

on:
  push:
    branches:
      - main
      - mememe-mvp-0.1-core
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Deterministic replay fixture
        run: npm run test:replay

      - name: Lockstep peer simulator
        run: npm run test:lockstep

      - name: Host client queue and snapshot resync
        run: npm run test:host-client

      - name: Client intent host authority protocol
        run: npm run test:authority
