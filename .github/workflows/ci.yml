name: MeMeMe MVP CI

on:
  push:
    branches:
      - main
      - mememe-mvp-0.1-core
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Deterministic replay fixture
        run: npm run test:replay

      - name: Lockstep peer simulator
        run: npm run test:lockstep

      - name: Host client queue and snapshot resync
        run: npm run test:host-client

      - name: Client intent host authority protocol
        run: npm run test:authority

      - name: Two-tab local browser session core
        run: npm run test:two-tab

      - name: Demo match shell and rematch
        run: npm run test:demo-shell

      - name: Simple CPU autoplay stress
        run: npm run test:bots

      - name: Validate external playtest package
        run: npm run test:package

      - name: Add full playtest guide to package
        run: cp docs/PLAYTEST_0.1.16.md dist/PLAYTEST_GUIDE.md

      - name: Upload first external playtest build
        uses: actions/upload-artifact@v4
        with:
          name: mememe-playtest-0.1.16.2
          path: dist
          if-no-files-found: error
          retention-days: 14
