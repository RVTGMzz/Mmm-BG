name: MeMeMe MVP CI

on:
  push:
    branches:
      - main
      - mememe-mvp-0.1-core
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mememe-build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 2

      - name: Deterministic replay fixture
        run: npm run test:replay

      - name: Lockstep peer simulator
        run: npm run test:lockstep

      - name: Host client queue and snapshot resync
        run: npm run test:host-client

      - name: Client intent host authority protocol
        run: npm run test:authority

      - name: Two-tab local browser session core
        run: npm run test:two-tab

      - name: Demo match shell and rematch
        run: npm run test:demo-shell

      - name: Simple CPU autoplay stress
        run: npm run test:bots

      - name: Tile Card News Reaction presentation parity
        run: npm run test:presentation

      - name: Presentation flow gate and parity routing
        run: npm run test:flow

      - name: Board flow movement and timing policy
        run: npm run test:board-flow

      - name: Board readability and turn feel
        run: npm run test:board-feel

      - name: Settings and early Menu BGM startup
        run: npm run test:settings

      - name: Content depth and tile identity
        run: npm run test:content

      - name: Card reaction personality and route feedback
        run: npm run test:reaction-route

      - name: Party mechanics deterministic rules
        run: npm run test:party

      - name: 200B economy scale
        run: npm run test:economy

      - name: Turn stakes money leaderboard
        run: npm run test:stakes

      - name: Tactical Choice and NPC Banter rules
        run: npm run test:tactical

      - name: Mini Game and Job tile foundation
        run: npm run test:function-tiles

      - name: Direct dice control
        run: npm run test:direct-dice

      - name: Job Dice salary Roll For Order Mini Games and payout
        run: npm run test:job-minigame

      - name: Mini Game host-system payout ownership
        run: npm run test:minigame-authority

      - name: Choice SFX coverage and one-lap copy
        run: npm run test:choice-sfx

      - name: Final result transition invariants
        run: npm run test:final-result

      - name: Lap-native legacy shell copy
        run: npm run test:legacy-shell-copy

      - name: Authoritative final podium and tie ranking
        run: npm run test:final-podium

      - name: Podium face reactions and winner spotlight
        run: npm run test:podium-reaction

      - name: Face image transform bounds
        run: npm run test:image

      - name: Validate external playtest package
        run: npm run test:package

      - name: Add full playtest guide to package
        run: cp docs/PLAYTEST_0.1.42.md dist/PLAYTEST_GUIDE.md

      - name: Upload MVP 0.1.42 external playtest build
        uses: actions/upload-artifact@v4
        with:
          name: mememe-playtest-0.1.42
          path: dist
          if-no-files-found: error
          retention-days: 14
