name: MeMeMe MVP CI

on:
  push:
    branches:
      - main
      - mememe-mvp-0.1-core
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mememe-build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 2

      - name: Deterministic replay fixture
        run: npm run test:replay
      - name: Lockstep peer simulator
        run: npm run test:lockstep
      - name: Host client queue and snapshot resync
        run: npm run test:host-client
      - name: Client intent host authority protocol
        run: npm run test:authority
      - name: Two-tab local browser session core
        run: npm run test:two-tab
      - name: Demo match shell and rematch
        run: npm run test:demo-shell
      - name: Simple CPU autoplay stress
        run: npm run test:bots
      - name: Tile Card News Reaction presentation parity
        run: npm run test:presentation
      - name: Presentation flow gate and Draft D manual routing
        run: npm run test:flow
      - name: Board flow movement and timing policy
        run: npm run test:board-flow
      - name: Board readability and turn feel
        run: npm run test:board-feel
      - name: Settings and early Menu BGM startup
        run: npm run test:settings
      - name: Content depth and tile identity
        run: npm run test:content
      - name: Card reaction personality and route feedback
        run: npm run test:reaction-route
      - name: Party mechanics deterministic rules
        run: npm run test:party
      - name: 200B economy scale
        run: npm run test:economy
      - name: Turn stakes money leaderboard
        run: npm run test:stakes
      - name: Tactical Choice and NPC Banter rules
        run: npm run test:tactical
      - name: Mini Game and Job tile foundation
        run: npm run test:function-tiles
      - name: Direct dice control
        run: npm run test:direct-dice
      - name: Job Dice salary Roll For Order Mini Games and payout
        run: npm run test:job-minigame
      - name: Mini Game host-system payout ownership
        run: npm run test:minigame-authority
      - name: Choice SFX coverage and one-lap copy
        run: npm run test:choice-sfx
      - name: Final result transition invariants
        run: npm run test:final-result
      - name: Lap-native legacy shell copy
        run: npm run test:legacy-shell-copy
      - name: Authoritative final podium and tie ranking
        run: npm run test:final-podium
      - name: Podium face reactions and winner spotlight
        run: npm run test:podium-reaction
      - name: Podium low-to-high reveal cadence
        run: npm run test:podium-reveal
      - name: Result controls unlock after podium reveal
        run: npm run test:podium-unlock
      - name: Remote Roll For Order host authority
        run: npm run test:remote-roll-order
      - name: Job Hub multiplayer authority and presentation
        run: npm run test:job-hub-multiplayer
      - name: Multiplayer presentation parity
        run: npm run test:presentation-parity
      - name: 0.1.48 audio dice BGM and token bugfix pass
        run: npm run test:bugfix-pass
      - name: 0.1.50 Final Map preview topology and rules
        run: npm run test:final-map-preview
      - name: 0.1.51 Draft D branches camera and retained rules
        run: npm run test:draft-d-preview
      - name: 0.1.52 fixed UI camera and persistent full-map review
        run: npm run test:draft-d-ui-fix
      - name: 0.1.53 left-right forward branching and true full-map review
        run: npm run test:branching-053
      - name: 0.1.54 deterministic AUTO MANUAL branch sandbox
        run: npm run test:preview-branch-mode-054
      - name: 0.1.55 canonical Draft D topology and five Mini Games
        run: npm run test:canonical-draft-d-055
      - name: 0.1.56 SAFE DRAMA MONEY branch identity
        run: npm run test:branch-identity-056
      - name: 0.1.56.1 canonical camera HUD and build source
        run: npm run test:canonical-presentation-0561
      - name: 0.1.57 authoritative Jail Hospital Lottery and Mini Game eligibility
        run: npm run test:special-locations-057
      - name: 0.1.58 TIN TỨC LÁ BÀI authoritative depth
        run: npm run test:news-card-depth-058
      - name: 0.1.59 Job and five Mini Game arena depth
        run: npm run test:job-minigame-depth-059
      - name: 0.1.60 pacing economy finish-lock
        run: npm run test:pacing-economy-060
      - name: 0.1.61 deterministic local playtest report
        run: npm run test:playtest-telemetry-061
      - name: 0.1.61.1 deterministic full-match simulation harness
        env:
          SIMULATION_BASELINE_OUTPUT: dist/SIMULATION_BASELINE_0.1.61.1.txt
        run: npm run test:simulation-baseline-0611
      - name: 0.1.63.4 post-Job-continuation sentinel replay
        env:
          OUTLIER_REPLAY_OUTPUT: dist/OUTLIER_REPLAY_0.1.63.4.txt
        run: npm run test:outlier-replay-0634
      - name: 0.1.62 HOST parity branches and round tile readability
        run: npm run test:random-branch-round-tiles-062
      - name: 0.1.63 UI readability and smooth follow polish
        run: npm run test:ui-smooth-polish-063
      - name: 0.1.63.1 active-player center lock
        run: npm run test:active-player-center-lock-0631
      - name: 0.1.63.2 movement presentation actor camera lock
        run: npm run test:movement-actor-camera-lock-0632
      - name: 0.1.63.3 presentation/release D6 synchronization
        run: npm run test:presentation-release-sync-0633
      - name: 0.1.63.4 Job continuation and landing effect synchronization
        run: npm run test:job-continue-landing-sync-0634
      - name: 0.1.64 expanded board release corridor and audio rebalance
        run: npm run test:expanded-board-release-audio-064
      - name: Face image transform bounds
        run: npm run test:image
      - name: Validate external playtest package
        run: npm run test:package

      - name: Add 0.1.64 playtest guide to package
        run: cp docs/PLAYTEST_0.1.64_EXPANDED_BOARD_RELEASE_AUDIO.md dist/PLAYTEST_GUIDE.md

      - name: Upload MVP 0.1.64 expanded board release audio build
        uses: actions/upload-artifact@v4
        with:
          name: mememe-playtest-0.1.64-expanded-board-release-audio
          path: dist
          if-no-files-found: error
          retention-days: 14
