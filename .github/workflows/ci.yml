      - name: 0.1.65 Job salary HUD rounded UI and debug cleanup
        run: npm run test:job-hud-rounded-ui-065
      - name: 0.1.65.1 UI ghost cleanup gamepad and Steam Deck web
        run: npm run test:ui-ghost-gamepad-web-0651
      - name: 0.1.70.4.24 Steam Deck controller navigation and modal ownership
        run: npm run test:steam-deck-070424
      - name: 0.1.66 unified flow match length and Mini Game readability
        run: npm run test:unified-flow-match-length-066
      - name: 0.1.68 vertical slice inherited authority flow
        run: npm run test:vertical-slice-068
      - name: Canonical UI UX design contract
        run: npm run test:canonical-ui-ux
      - name: 0.1.68.2 active HUD Job details and safe bubbles
        run: npm run test:canonical-ui-0682
      - name: 0.1.69 first impression polish
        run: npm run test:first-impression-069
      - name: 0.1.70.1 release flow repair + UI density
        run: npm run test:career-traits-070
      - name: 0.1.70.1 readable modal copy and overflow regression
        run: npm run test:ui-copy-overflow-0701
      - name: 0.1.70.2 online Worker and Durable Object foundation
        run: npm run test:online-worker-0702
      - name: 0.1.70.2 online client transport and room lobby
