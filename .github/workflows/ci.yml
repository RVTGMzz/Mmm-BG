      - name: 0.1.54 deterministic AUTO MANUAL branch sandbox
        run: npm run test:preview-branch-mode-054
      - name: 0.1.55 canonical Draft D topology and five Mini Games
        run: npm run test:canonical-draft-d-055
      - name: 0.1.56 SAFE DRAMA MONEY branch identity
        run: npm run test:branch-identity-056
      - name: 0.1.56.1 canonical camera HUD and build source
        run: npm run test:canonical-presentation-0561
      - name: 0.1.57 authoritative Jail Hospital Lottery and Mini Game eligibility
        run: npm run test:special-locations-057
      - name: 0.1.58 TIN TỨC LÁ BÀI authoritative depth
        run: npm run test:news-card-depth-058
      - name: 0.1.59 Job and five Mini Game arena depth
        run: npm run test:job-minigame-depth-059
      - name: 0.1.60 pacing economy finish-lock
