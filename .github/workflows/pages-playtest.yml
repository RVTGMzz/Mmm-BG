name: MMM Legacy GitHub Pages Fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mmm-pages-legacy-fallback
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' && steps.pages_artifact.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web fallback
        run: npm run build

      - name: Configure GitHub Pages if manually requested
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: pages_artifact
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy manual fallback
        id: deployment
        uses: actions/deploy-pages@v4
