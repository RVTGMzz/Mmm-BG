name: MeMeMe Steam Deck Web Playtest

on:
  push:
    branches:
      - mememe-mvp-0.1-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mememe-pages-playtest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Steam Deck web playtest
        run: npm run build

      - name: Upload standalone Steam Deck web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mememe-steamdeck-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages if enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Pages enablement note
        if: steps.pages.outcome != 'success'
        run: echo "GitHub Pages is not enabled yet. In repository Settings > Pages, set Source to GitHub Actions once; future pushes will deploy automatically."

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Steam Deck web playtest
        id: deployment
        uses: actions/deploy-pages@v4
