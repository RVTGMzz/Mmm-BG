name: MeMeMe Steam Deck Web Playtest

on:
  push:
    branches:
      - mememe-mvp-0.1-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mememe-pages-playtest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' && steps.pages_artifact.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Steam Deck web playtest
        run: npm run build

      - name: Upload standalone Steam Deck web artifact
        id: standalone_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mememe-steamdeck-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Build compact public web mirror
        run: npx vite build --config vite.web-mirror.config.ts --outDir dist-web --emptyOutDir

      - name: Verify compact public web mirror
        run: |
          test -f dist-web/index.html
          test -d dist-web/assets
          grep -q 'phaser@3.90.0/dist/phaser.esm.js' dist-web/index.html
          find dist-web/assets -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload compact public web mirror artifact
        id: mirror_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mememe-web-mirror-dist
          path: dist-web
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages if enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: pages_artifact
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Artifact and Pages status note
        if: always()
        run: |
          echo "standalone_artifact=${{ steps.standalone_artifact.outcome }}"
          echo "mirror_artifact=${{ steps.mirror_artifact.outcome }}"
          echo "pages_config=${{ steps.pages.outcome }}"
          echo "pages_artifact=${{ steps.pages_artifact.outcome }}"
          echo "Artifact uploads are best-effort so storage quota cannot block a valid build."
          echo "The canonical public web mirror is published independently by publish-web-mirror.yml."

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Steam Deck web playtest
        id: deployment
        uses: actions/deploy-pages@v4
