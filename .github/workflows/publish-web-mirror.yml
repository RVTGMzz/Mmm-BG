name: Publish compiled web mirror

on:
  workflow_run:
    workflows:
      - MeMeMe MVP CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_REPO: ronvotri/ronvotri-MeMeMe-Web-Playtest

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'mememe-mvp-0.1-core')
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror credential
        id: mirror-token
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.MEMEME_WEB_DEPLOY_TOKEN }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'MEMEME_WEB_DEPLOY_TOKEN is not configured yet; compiled mirror publish is skipped safely.'
          fi

      - name: Checkout exact private source
        if: steps.mirror-token.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        if: steps.mirror-token.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Build compiled web only
        if: steps.mirror-token.outputs.ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test -z "$(find dist -type f -name '*.map' -print -quit)"
          test ! -d dist/src
          test ! -d dist/tests
          test ! -d dist/docs

      - name: Checkout public mirror
        if: steps.mirror-token.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.MEMEME_WEB_DEPLOY_TOKEN }}
          path: public-mirror

      - name: Replace compiled site only
        if: steps.mirror-token.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf public-mirror/assets
          cp dist/index.html public-mirror/index.html
          cp -R dist/assets public-mirror/assets
          printf '\n' >> public-mirror/index.html
          sed -i '1i<!-- Copyright © 2026 MeMeMe. All rights reserved. Compiled playtest build only. -->' public-mirror/index.html

      - name: Commit public mirror
        if: steps.mirror-token.outputs.ready == 'true'
        working-directory: public-mirror
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Public compiled mirror already matches this build.'
            exit 0
          fi
          git commit -m "Publish compiled MeMeMe web playtest ${GITHUB_SHA::7}"
          git push
