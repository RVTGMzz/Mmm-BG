name: Publish compiled GitHub playtest

on:
  push:
    branches:
      - mmm-mvp-0.1-core
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mmm-github-playtest-publish
  cancel-in-progress: true

env:
  PUBLIC_REPO: ronvotri/MeMeMe-Web-Playtest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror credential
        id: mirror-token
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.MMM_WEB_DEPLOY_TOKEN }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'MMM_WEB_DEPLOY_TOKEN is not configured yet; GitHub playtest publish is skipped safely.'
          fi

      - name: Wait for exact-SHA CI success
        if: steps.mirror-token.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            status="$(printf '%s' "$payload" | jq -r '.workflow_runs[] | select(.name == "MMM MVP CI") | .status' | head -n1)"
            conclusion="$(printf '%s' "$payload" | jq -r '.workflow_runs[] | select(.name == "MMM MVP CI") | .conclusion // ""' | head -n1)"

            if [ "$status" = 'completed' ]; then
              if [ "$conclusion" = 'success' ]; then
                echo "Exact-SHA CI passed for ${GITHUB_SHA}."
                exit 0
              fi
              echo "Exact-SHA CI completed with conclusion: ${conclusion:-unknown}. Refusing playtest publish."
              exit 1
            fi

            echo "Waiting for exact-SHA CI (${attempt}/60), current status: ${status:-not-found-yet}"
            sleep 10
          done
          echo 'Timed out waiting for exact-SHA CI.'
          exit 1

      - name: Verify source is current branch HEAD
        id: head-guard
        if: steps.mirror-token.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mmm-mvp-0.1-core" --jq '.object.sha')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale publish ${GITHUB_SHA}; current HEAD is ${latest_sha}."
          fi

      - name: Checkout exact source
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Build compiled web only
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test -z "$(find dist -type f -name '*.map' -print -quit)"
          test ! -d dist/src
          test ! -d dist/tests
          test ! -d dist/docs

      - name: Checkout GitHub playtest mirror
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.MMM_WEB_DEPLOY_TOKEN }}
          path: public-mirror

      - name: Replace compiled site only
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        shell: bash
        run: |
          rm -rf public-mirror/assets
          cp dist/index.html public-mirror/index.html
          cp -R dist/assets public-mirror/assets
          sed -i '1i<!-- Compiled playtest build only. Source is not mirrored here. -->' public-mirror/index.html

      - name: Commit GitHub playtest mirror
        if: steps.mirror-token.outputs.ready == 'true' && steps.head-guard.outputs.current == 'true'
        working-directory: public-mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Compiled GitHub playtest already matches this build.'
            exit 0
          fi
          git commit -m "Publish compiled playtest ${GITHUB_SHA::7}"
          git push
